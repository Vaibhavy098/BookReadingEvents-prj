name: BookReadingEvents CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Source Code/BookReadingEvents/BookReadingEvents.slnx"

      - name: Build
        run: dotnet build "Source Code/BookReadingEvents/BookReadingEvents.slnx" --no-restore

      - name: Test
        run: dotnet test "Source Code/BookReadingEvents/BookReadingEvents.slnx" --no-build
